# 测试环境不依赖本机 MySQL：使用内存 H2（与 spring.datasource.test 绑定一致）
spring.datasource.test.driver-class-name=org.h2.Driver
spring.datasource.test.jdbc-url=jdbc:h2:mem:tablegen_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.test.username=sa
spring.datasource.test.password=sa

# 本 demo 未使用 Spring Data JDBC Repository，仅 JDBC + 自定义 DAL；避免启动时探测方言去连库
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration
