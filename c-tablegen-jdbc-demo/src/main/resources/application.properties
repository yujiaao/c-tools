spring.datasource.test.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.test.initial-size= '20'
spring.datasource.test.jdbc-url= jdbc:mysql://localhost:3306/test?useUnicode=true&useSSL=false&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&&allowMultiQueries=true
spring.datasource.test.max-active= '200'
spring.datasource.test.min-idle= '20'
spring.datasource.test.password= test123
spring.datasource.test.test-on-borrow= 'true'
spring.datasource.test.test-while-idle= 'true'
spring.datasource.test.time-between-eviction-runs-millis= '3600000'
spring.datasource.test.username=test


