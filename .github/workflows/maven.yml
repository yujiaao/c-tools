# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
env:
  DB_DATABASE: test
  DB_USER: root
  DB_PASSWORD: root
  
name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: maven
    - name: Set up MySQL    
      run: |
        sudo /etc/init.d/mysql start
        mysql -e "CREATE DATABASE ${{ env.DB_DATABASE }}; CREATE USER 'test'@'%' IDENTIFIED BY 'test123'; GRANT ALL PRIVILEGES ON *.* TO 'test'@'%';" -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }}
    # c-dbtools：默认本地构建为 h2 且不跑 probe（快）；CI 已起 MySQL，这里用 auto 探测并选用 mysql 模板。
    - name: Build with Maven
      run: mvn -B package --file pom.xml -Dconnection.pool.profile=auto -Djacoco.skip=false
    - name: Static checks (non-blocking)
      continue-on-error: true
      run: mvn -B -DskipTests pmd:pmd
    - name: Upload PMD reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pmd-reports-jdk-${{ matrix.java }}
        path: |
          **/target/pmd.xml
        if-no-files-found: ignore
