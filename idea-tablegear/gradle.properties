# Gradle properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# IntelliJ Plugin 构建优化
org.jetbrains.intellij.ideaDirectory=

# 关闭 Gradle IntelliJ 插件的「自更新检查」（会向 GitHub 查询最新插件版本）。
# 内网/代理/防火墙下常见 NPE：getHeaderField("Location") must not be null
# 参见：https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin-build-features.html
org.jetbrains.intellij.buildFeature.selfUpdateCheck=false

# Prevent Kotlin plugin from adding stdlib automatically
kotlin.stdlib.default.dependency=false
