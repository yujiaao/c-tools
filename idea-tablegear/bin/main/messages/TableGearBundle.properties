prop.alias.desc=Data source/project alias used as Spring Bean qualifier for multiple data sources and read-write separation.
prop.package_name.desc=Root package name for generated code.
prop.src_dir.desc=Output directory for main source code.
prop.test_dir.desc=Output directory for test source code.
prop.resource_dir.desc=Output directory for resource files.
prop.service_dir.desc=Output directory for service code.
prop.controller_dir.desc=Output directory for controller code.
prop.dto_dir.desc=Output directory for DTO code.
prop.cmd_dir.desc=Output directory for command/DTO code.
prop.extra_setting.desc=Path to extra config file (e.g. pojos.xml).
prop.generate_all.desc=Whether to perform full generation; no means incremental mode.
prop.over_write_all.desc=Whether to overwrite existing files.
prop.enable_merge.desc=Enable smart merge; preserves user edits in Dto/SearchCmd/Converter files.
prop.use_annotation.desc=Enable Jakarta Validation/Swagger annotations.
prop.use_swagger.desc=Whether controllers generate Swagger annotations.
prop.api_doc_provider.desc=API doc provider. In springdoc mode Swagger annotations are not generated; if unset, legacy behavior applies.
prop.swagger_version.desc=Swagger/OpenAPI version.
prop.ignore_fields.desc=Fields ignored during generation, format table:field1,field2 or field1,field2.
prop.collection_fields.desc=Fields generated as collection types.
prop.add_prefix.desc=Prefix added to generated class and file names.
prop.remove_prefix.desc=Prefix removed when parsing table names.
prop.projectname.desc=Generated project name used in generated artifacts.
prop.className.desc=JDBC driver class, e.g. com.mysql.cj.jdbc.Driver.
prop.dburl.desc=Database JDBC URL.
prop.username.desc=Database username.
prop.password.desc=Database password.
prop.schema.desc=Database schema/catalog used for filtering tables.
prop.table_owner.desc=Table owner (Oracle/DB2 etc).
prop.catalog.desc=JDBC catalog for metadata scope.
prop.read_write_separate.desc=Generate read-write separated injection by alias.
prop.keys.desc=Whether to generate primary key information.
prop.indexes.desc=Whether to generate index-related methods.
prop.types_are_strings.desc=Whether to parse all fields as strings.
prop.use_custom_meta_table.desc=Whether to use custom metadata table.
prop.table_list.desc=Tables included for generation, comma list or regex.
prop.exclude_table_list.desc=Tables excluded from generation, higher priority than table_list.
prop.view_list.desc=Virtual view definition; supports "view: select ...;" or "view: @relative/path.sql;".
prop.r2dbc.desc=Whether to generate R2DBC code.
prop.generate_baselist.desc=Whether to generate BaseList/list base class.
prop.use_autoincrement.desc=Use DB auto-increment and skip primary key insert generation.
prop.foreign_keys.desc=Whether to read foreign key metadata.
prop.kuozhanbiao.desc=Whether to enable extension table generation.
prop.modifydate_col.desc=Modify date column name.
prop.pojo_modifydate_interface.desc=Fully-qualified interface implemented for modify date.
prop.encrypted_fields.desc=Encrypted/decrypted fields, format table1:field1,field2;table2:field3,field4;.
prop.pojo_node_interface.desc=Interface to be implemented by POJO.
prop.pojo_node_interface_list.desc=Per-table list controlling node interface implementation.
prop.pojo_version_interface.desc=Fully-qualified POJO version interface.
prop.pojo_version_interface_list.desc=Per-table list controlling version interface implementation.
prop.pojo_state_interface.desc=Fully-qualified POJO state interface.
prop.pojo_state_interface_list.desc=Per-table list controlling state interface implementation.
prop.pojo_uuid_interface.desc=Fully-qualified POJO UUID interface.
prop.pojo_uuid_interface_list.desc=Per-table list controlling UUID interface implementation.
prop.pojo_modifydate_interface_list.desc=Per-table list controlling modify-date interface implementation.
prop.del_col_name.desc=Logical delete column name, default is_del.
prop.version_col_name.desc=Version column name, default version.
prop.jsp_dir.desc=Output directory for JSP files.
prop.shared_model_group.desc=Shared model group name.
prop.generate_procedures.desc=Whether to generate stored procedure code.
prop.type.desc=Generation mode: database(default), elasticsearch_mapping, elasticsearch_sample, json.
prop.url.desc=ElasticSearch endpoint (e.g. http://localhost:9200) or JSON file path.
prop.index_list.desc=ElasticSearch index list, format indexName:aliasName or indexName.
prop.primary_key_fields.desc=ES primary key fields mapped to _id, comma-separated.
