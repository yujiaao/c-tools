## bean name of ElasticSearch connection configuration
alias=contentEs

## type elasticsearch_mapping, elasticsearch_sample, json

type=elasticsearch_mapping
url=http://localhost:9200
username=
password=

src_dir=src/main/java

package_name=com.example.es

# index_list =  indexName:aliasName,indexName2:aliasName2
index_list=info-source:contents
primary_key_fields=info_id

ignore_fields=duaration
collection_fields=play_url,multi_images,price
